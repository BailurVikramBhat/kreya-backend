name: CI

on:
  push:
    branches:
      - master
      - "*-release"
      - "feat/**"
  pull_request:
    branches:
      - master
      - "*-release"

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kreya_test
          POSTGRES_USER: kreya
          POSTGRES_PASSWORD: kreya
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kreya -d kreya_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:postgresql://localhost:5432/kreya_test
      DB_USERNAME: kreya
      DB_PASSWORD: kreya
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always() && (github.ref == 'refs/heads/master' || github.base_ref == 'master')
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test

  code-style:
    name: Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run style checks
        run: ./gradlew check --no-daemon

  master-hardening:
    name: master Hardening
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kreya_test
          POSTGRES_USER: kreya
          POSTGRES_PASSWORD: kreya
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kreya -d kreya_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:postgresql://localhost:5432/kreya_test
      DB_USERNAME: kreya
      DB_PASSWORD: kreya
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build boot jar
        run: ./gradlew clean bootJar --no-daemon
