spring:
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kreya}
    username: ${DB_USERNAME:kreya}
    password: ${DB_PASSWORD:kreya}
    hikari:
      connection-init-sql: SET timezone = 'UTC'
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:kreya}
